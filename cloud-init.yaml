#cloud-config
package_update: true
packages:
  - apache2

runcmd:
  - |
    cat << 'EOF' > /var/www/html/index.html
    <!DOCTYPE html>
    <html>
    <head>
      <title>Week 7</title>
      <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9; }
        h1 { font-size: 2.5em; color: #333; }
        p { font-size: 1.2em; color: #666; }
      </style>
    </head>
    <body>
      <h1>Hello from Week 7!</h1>
      <p><strong>Student:</strong> ${student_name}</p>
      <p><strong>Message:</strong> ${page_message}</p>
    </body>
    </html>
    EOF
  - systemctl restart apache2
